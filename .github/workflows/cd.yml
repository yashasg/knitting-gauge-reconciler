# CD workflow
# Manual-only distribution workflow that builds from the GitLab source of truth and uploads via Fastlane's beta (TestFlight) or release (App Store) lane.
# CI remains in .github/workflows/ci.yml; this workflow intentionally has no automatic push/MR trigger.
# Required GitHub secrets:
# - GITLAB_PAT: GitLab PAT with read access to yashasg/knitting-gauge-reconciler and yashasg/fastlane_hisa
# - ASC_API_KEY_JSON
# - MATCH_PASSWORD

name: CD

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Which Fastlane lane to run (beta = TestFlight, release = App Store)
        required: true
        default: beta
        type: choice
        options:
          - beta
          - release
      ref_type:
        description: Build from a branch or a tag?
        required: true
        default: branch
        type: choice
        options:
          - branch
          - tag
      ref:
        description: Main branch or tag name to build (e.g. main, v1.2.3)
        required: true
        default: main
        type: string
      notes:
        description: Optional release notes passed to the selected Fastlane lane
        required: false
        default: ""
        type: string
      version_bump:
        description: Semantic version bump before TestFlight build-number increment (patch default; choose none for tag dispatches)
        required: false
        default: patch
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: read
  actions: read

env:
  XCODE_VERSION: "26"
  DERIVED_DATA_PATH: ${{ github.workspace }}/app/.build/derived-data
  GITLAB_PROJECT: yashasg/knitting-gauge-reconciler
  GITLAB_PROJECT_ID: "82328092"

jobs:
  testflight:
    name: ${{ inputs.lane == 'release' && 'App Store Release' || 'TestFlight' }}
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: cd-${{ inputs.lane }}-${{ inputs.ref }}
      cancel-in-progress: false
    env:
      TESTFLIGHT_NOTES: ${{ inputs.notes }}

    steps:
      - name: Validate dispatch inputs
        env:
          LANE: ${{ inputs.lane }}
          REF: ${{ inputs.ref }}
          REF_TYPE: ${{ inputs.ref_type }}
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail
          case "$LANE" in
            beta|release) ;;
            *) echo "::error::Invalid lane: $LANE"; exit 1 ;;
          esac
          case "$REF_TYPE" in
            branch|tag) ;;
            *) echo "::error::Invalid ref_type: $REF_TYPE"; exit 1 ;;
          esac
          case "$VERSION_BUMP" in
            none|patch|minor|major) ;;
            *) echo "::error::Invalid version_bump: $VERSION_BUMP"; exit 1 ;;
          esac
          if [[ "$REF_TYPE" == "branch" && "$REF" != "main" ]]; then
            echo "::error::Branch releases must use main"
            exit 1
          fi
          if [[ "$REF_TYPE" == "tag" && "$VERSION_BUMP" != "none" ]]; then
            echo "::error::version_bump must be 'none' when ref_type is 'tag'"
            exit 1
          fi
          if [[ "$REF_TYPE" == "tag" ]] && ! git check-ref-format "refs/tags/$REF"; then
            echo "::error::Invalid tag name: $REF"
            exit 1
          fi

      - name: Resolve exact GitLab source
        id: source
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
          REF: ${{ inputs.ref }}
          REF_TYPE: ${{ inputs.ref_type }}
        run: |
          set -euo pipefail
          api="https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID"
          encoded_ref="$(jq -rn --arg value "$REF" '$value | @uri')"
          case "$REF_TYPE" in
            branch) endpoint="$api/repository/branches/$encoded_ref" ;;
            tag) endpoint="$api/repository/tags/$encoded_ref" ;;
          esac
          source="$(
            curl --fail --silent --show-error \
              --header "PRIVATE-TOKEN: $GITLAB_PAT" \
              "$endpoint"
          )"
          [[ "$(jq -er '.name' <<< "$source")" == "$REF" ]] || {
            echo "::error::Resolved GitLab ref does not match $REF"
            exit 1
          }
          source_sha="$(jq -er '.commit.id | select(test("^[0-9a-f]{40}$"))' <<< "$source")"
          main="$(
            curl --fail --silent --show-error \
              --header "PRIVATE-TOKEN: $GITLAB_PAT" \
              "$api/repository/branches/main"
          )"
          [[ "$(jq -er '.name' <<< "$main")" == "main" ]] || {
            echo "::error::Could not resolve GitLab main"
            exit 1
          }
          main_sha="$(jq -er '.commit.id | select(test("^[0-9a-f]{40}$"))' <<< "$main")"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact GitLab source
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
          MAIN_SHA: ${{ steps.source.outputs.main_sha }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          cleanup_git_auth() {
            unset auth_header GITLAB_PAT
            git config --local --unset-all http.extraHeader > /dev/null 2>&1 || true
          }
          trap cleanup_git_auth EXIT

          git init .
          git remote add origin "https://gitlab.com/${GITLAB_PROJECT}.git"
          auth_header="$(printf 'oauth2:%s' "$GITLAB_PAT" | base64 | tr -d '\n')"
          git -c "http.extraHeader=Authorization: Basic $auth_header" \
            fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          cleanup_git_auth
          fetched_main_sha="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          if [[ "$fetched_main_sha" != "$MAIN_SHA" ]]; then
            echo "::error::Fetched main does not match resolved GitLab main SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_SHA" "$MAIN_SHA"; then
            echo "::error::Release source is not reachable from GitLab main"
            exit 1
          fi
          git checkout --detach "$SOURCE_SHA"
          if git config --local --get-regexp '^http\..*extraheader$' > /dev/null 2>&1; then
            echo "::error::GitLab checkout credential persisted in local Git config"
            exit 1
          fi
          [[ "$(git remote get-url origin)" == "https://gitlab.com/${GITLAB_PROJECT}.git" ]] || {
            echo "::error::GitLab checkout credential persisted in the remote URL"
            exit 1
          }

      - name: Require canonical green pipeline for exact source
        env:
          EXPECTED_RUN_URL_PREFIX: https://github.com/${{ github.repository }}/actions/runs/
          GH_TOKEN: ${{ github.token }}
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          api="https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID"
          statuses="$(
            curl --fail --silent --show-error --get \
              --header "PRIVATE-TOKEN: $GITLAB_PAT" \
              --data-urlencode "per_page=100" \
              --data-urlencode "name=Build & Test" \
              --data-urlencode "order_by=id" \
              --data-urlencode "sort=desc" \
              "$api/repository/commits/$SOURCE_SHA/statuses"
          )"
          latest_status="$(
            jq -er \
              'if type != "array" then error("statuses is not an array") else
                [.[] | select(
                  type == "object" and
                  .name == "Build & Test"
                )] |
                if length == 0 then error("Build & Test status is missing")
                else max_by(.id)
                end
              end' \
              <<< "$statuses"
          )"
          if ! jq -e \
            --arg sha "$SOURCE_SHA" \
            --arg prefix "$EXPECTED_RUN_URL_PREFIX" \
            '(.id | type == "number") and
             .ref == "main" and
             .sha == $sha and
             .status == "success" and
             ((.target_url // "") | startswith($prefix)) and
             (((.target_url // "") | ltrimstr($prefix)) | test("^[1-9][0-9]*$")) and
             (.pipeline_id | type == "number") and
             .pipeline_id > 0 and
             (.pipeline_id | floor) == .pipeline_id' \
            <<< "$latest_status" > /dev/null; then
            echo "::error::Latest Build & Test status is not canonical and successful"
            exit 1
          fi
          pipeline_id="$(jq -er '.pipeline_id' <<< "$latest_status")"
          run_url="$(jq -er '.target_url' <<< "$latest_status")"
          run_id="${run_url#"$EXPECTED_RUN_URL_PREFIX"}"

          pipeline="$(
            curl --fail --silent --show-error \
              --header "PRIVATE-TOKEN: $GITLAB_PAT" \
              "$api/pipelines/$pipeline_id"
          )"
          if ! jq -e \
            --arg sha "$SOURCE_SHA" \
            --argjson id "$pipeline_id" \
            '.id == $id and
             .sha == $sha and
             .ref == "main" and
             .status == "success" and
             .source == "external"' \
            <<< "$pipeline" > /dev/null; then
            echo "::error::GitLab pipeline is not canonical for $SOURCE_SHA"
            exit 1
          fi

          github_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          jq -e \
            --arg display_title "CI $SOURCE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_url "$run_url" \
            --argjson id "$run_id" \
            '.id == $id and
             .name == "CI" and
             .display_title == $display_title and
             .event == "repository_dispatch" and
             .status == "completed" and
             .conclusion == "success" and
             .html_url == $run_url and
             .repository.full_name == $repository and
             (.path == ".github/workflows/ci.yml" or
              (.path | startswith(".github/workflows/ci.yml@")))' \
            <<< "$github_run" > /dev/null
          github_jobs="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100"
          )"
          jq -e \
            'any(
              .jobs[];
              .name == "Build & Test" and
              .status == "completed" and
              .conclusion == "success" and
              any(
                .steps[];
                .name == "Build & Test" and
                .status == "completed" and
                .conclusion == "success"
              )
            )' \
            <<< "$github_jobs" > /dev/null

      - name: Restore DerivedData cache
        id: cache-derived-data
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}
            $HOME/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          key: derived-data-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-Release-${{ inputs.ref }}-${{ hashFiles('app/app.xcodeproj/**/*.pbxproj', 'app/app.xcodeproj/xcshareddata/xcschemes/*.xcscheme') }}
          restore-keys: |
            derived-data-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-Release-${{ inputs.ref }}-
            derived-data-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-Release-main-

      - name: Setup Ruby for fastlane
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1 head audited 2026-07-17
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: app

      - name: Run canonical unit test gate
        working-directory: app
        run: bundle exec ./build.sh test

      - name: Install Apple WWDR intermediate certificate
        run: |
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG6.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer
          echo "WWDR_CERT_PATH=$RUNNER_TEMP/AppleWWDRCAG6.cer" >> "$GITHUB_ENV"

      - name: Upload via Fastlane lane
        env:
          ASC_API_KEY_JSON: ${{ secrets.ASC_API_KEY_JSON }}
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
          LANE: ${{ inputs.lane }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          VERSION_BUMP: ${{ inputs.version_bump }}
        working-directory: app
        run: |
          set -euo pipefail
          cleanup() {
            set +e
            unset \
              ASC_API_KEY_JSON \
              GITLAB_PAT \
              MATCH_GIT_BASIC_AUTHORIZATION \
              MATCH_KEYCHAIN_PASSWORD \
              MATCH_PASSWORD
            rm -f fastlane/asc_api_key.json fastlane/*.p8
            rm -f "$RUNNER_TEMP/AppleWWDRCAG6.cer"
            keychain_path="$HOME/Library/Keychains/fastlane_tmp_keychain-db"
            if [[ -e "$keychain_path" ]]; then
              security delete-keychain "$keychain_path"
            fi
          }
          trap cleanup EXIT

          umask 077
          mkdir -p fastlane
          printf '%s' "$ASC_API_KEY_JSON" > fastlane/asc_api_key.json
          if ! jq -e 'type == "object" and
            (.key_id | type == "string" and length > 0) and
            (.issuer_id | type == "string" and length > 0) and
            (.key | type == "string" and length > 0)' \
            fastlane/asc_api_key.json > /dev/null; then
            echo "::error::ASC_API_KEY_JSON is invalid or missing key_id/issuer_id/key"
            exit 1
          fi
          unset ASC_API_KEY_JSON
          MATCH_GIT_BASIC_AUTHORIZATION="$(
            printf 'oauth2:%s' "$GITLAB_PAT" | base64 | tr -d '\n'
          )"
          export MATCH_GIT_BASIC_AUTHORIZATION
          unset GITLAB_PAT
          MATCH_KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          export MATCH_KEYCHAIN_PASSWORD

          fastlane_args=()

          if [[ "$VERSION_BUMP" != "none" ]]; then
            fastlane_args+=("bump:$VERSION_BUMP")
          fi

          if [[ -n "$TESTFLIGHT_NOTES" ]]; then
            fastlane_args+=("notes:$TESTFLIGHT_NOTES")
          fi

          bundle exec fastlane "$LANE" "${fastlane_args[@]}"

      - name: Clean release credentials
        if: always()
        working-directory: app
        run: |
          rm -f fastlane/asc_api_key.json fastlane/*.p8
          rm -f "$RUNNER_TEMP/AppleWWDRCAG6.cer"
          keychain_path="$HOME/Library/Keychains/fastlane_tmp_keychain-db"
          if [[ -e "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi

      - name: Save DerivedData cache
        if: always() && steps.cache-derived-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}
            $HOME/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          key: ${{ steps.cache-derived-data.outputs.cache-primary-key }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testflight-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/*.ipa
            app/*.pkg
            app/*.app.dSYM.zip
            app/*.dSYM.zip
            app/*.xcarchive
          if-no-files-found: warn
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xcode-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/.build/fastlane-output.log
            app/.build/KnittingGaugeReconciler.xcresult
            app/.build/gym/**/*.log
            ${{ env.DERIVED_DATA_PATH }}/Logs/Test/*.xcresult
            ${{ env.DERIVED_DATA_PATH }}/Logs/Build/*.xcactivitylog
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
