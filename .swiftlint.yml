included:
  - app/KnittingGaugeReconciler

excluded:
  - app/KnittingGaugeReconcilerTests

# Opt-in rules relevant to HIG compliance
opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - force_unwrapping

# Disable noisy rules that don't apply
disabled_rules:
  - todo
  - trailing_comma

# Custom rules — HIG compliance
custom_rules:
  no_hardcoded_font_size:
    name: "Hardcoded font size"
    message: "Use a Satoshi semantic font role instead of .font(.system(size:)). Hardcoded sizes don't scale with Dynamic Type. (HIG §Typography)"
    regex: '\.font\(\.system\(size:'
    severity: error

  no_system_semantic_font:
    name: "System font bypasses Satoshi"
    message: "Use the matching Satoshi semantic role (.satoshiHeadline, .satoshiBody, etc.) so typography stays branded and Dynamic Type-aware."
    regex: '\.font\(\.(?:largeTitle|title[23]?|headline|body|callout|subheadline|footnote|caption2?)\b'
    severity: error

  no_raw_padding_number:
    name: "No raw padding number"
    message: "Use a Spacing.* design token instead of a raw padding value."
    regex: '\bpadding\(\s*[1-9][0-9]*\b|\bpadding\(\.[a-zA-Z]+,\s*[1-9][0-9]*\b'
    severity: error

  no_raw_spacing_literal:
    name: "No raw spacing literal"
    message: "Use a Spacing.* design token for stack, inset, and spacer geometry."
    regex: '(?:VStack|HStack|LazyVStack|LazyHStack)\([^)]*spacing:\s*[1-9][0-9]*|EdgeInsets\([^)]*(?:top|bottom|leading|trailing):\s*[1-9][0-9]*|Spacer\(minLength:\s*[1-9][0-9]*'
    severity: error

  no_raw_corner_radius:
    name: "No raw corner radius"
    message: "Use a semantic Radius.* design token instead of a raw corner radius."
    regex: '\.cornerRadius\(\s*[1-9][0-9]*\b|RoundedRectangle\(cornerRadius:\s*[1-9][0-9]*\b|\.clipShape\(\s*RoundedRectangle\(cornerRadius:\s*[1-9][0-9]*\b|\.rect\(cornerRadius:\s*[1-9][0-9]*\b'
    severity: error

  no_fixed_frame_dimension:
    name: "No raw fixed frame dimension"
    message: "Use flexible layout, @ScaledMetric, or a Sizing.* design token instead of a raw frame dimension."
    regex: '\.frame\([^)]*(?:width|height|minWidth|minHeight|maxWidth|maxHeight):\s*[1-9][0-9]*\b'
    severity: error

  no_uppercased_in_code:
    name: "String .uppercased() in SwiftUI Text"
    message: "Use .textCase(.uppercase) modifier instead of .uppercased() — screen readers interpret pre-uppercased strings as acronyms. (HIG §Accessibility)"
    regex: 'Text\([^)]*\.uppercased\(\)'
    severity: error

  navigation_stack_in_sheet:
    name: "NavigationStack inside sheet"
    message: "Avoid wrapping sheet content in NavigationStack unless actual navigation occurs. Competing gestures can suppress swipe-to-dismiss. (HIG §Navigation)"
    regex: '\.sheet\b[^}]*NavigationStack'
    multiline_matching: true
    severity: error

  color_literal_rgb:
    name: "Hardcoded RGB color"
    message: "Use adaptive Color Assets (.xcassets) for structural colors so dark mode works. Fixed Color(red:green:blue:) values break in dark mode. (HIG §Color)"
    regex: 'Color\(red:\s*\d+\.\d+,\s*green:\s*\d+\.\d+,\s*blue:\s*\d+\.\d+'
    severity: error

  missing_min_touch_target:
    name: "Potential touch target below 44pt"
    message: "Buttons with .padding(.vertical, N) where N < 12 may fall below the 44pt minimum touch target. Use .frame(minHeight: 44) as a backstop. (HIG §Buttons)"
    regex: '\.padding\(\.vertical,\s*([0-9]|1[01])\b'
    severity: error

  # Accessibility Decision (2026-06-02): Dynamic Type must NEVER be capped.
  # Text must always render at the user's chosen Dynamic Type size.
  # Layout adapts via ViewThatFits — never via text shrinkage or size ceiling.
  no_minimum_scale_factor:
    name: "minimumScaleFactor shrinks text"
    message: "minimumScaleFactor shrinks text below the user's chosen Dynamic Type size — banned per accessibility decision; reflow with ViewThatFits instead."
    regex: '\.minimumScaleFactor\('
    severity: error

  no_dynamic_type_cap:
    name: "dynamicTypeSize partial-range ceiling"
    message: 'dynamicTypeSize cap clamps Dynamic Type growth — banned per accessibility decision; reflow with ViewThatFits instead. In a #Preview use .environment(\.dynamicTypeSize, .accessibilityN) not a view modifier.'
    regex: '\.dynamicTypeSize\(\.\.\.' # PartialRangeThrough ceiling pattern
    severity: error

  no_share_exports:
    name: "Legacy ShareExports type"
    message: "ShareExports is retired; use the current share/export model instead."
    regex: '\bShareExports\b'
    severity: error

  no_user_defaults_synchronize:
    name: "UserDefaults synchronize"
    message: "UserDefaults.standard.synchronize() is unnecessary and must not be used."
    regex: 'UserDefaults\.standard\.synchronize\s*\(\s*\)'
    severity: error

  no_positional_form_values:
    name: "Positional draft/form value access"
    message: "Use GaugeFormField/key-path access instead of numeric positions in draft or form values."
    included: '.*/ContentView(?:Helpers)?\.swift'
    regex: '\b(?:draft(?:\.[A-Za-z_][A-Za-z0-9_]*)?|(?:rawText|form)?[Vv]alues)\s*\[\s*[0-9]+\s*\]|\bdraftBinding\s*\([^,\n]+,\s*at:\s*[0-9]+\s*\)'
    severity: error
